groups:
  - name: oh-my-lazier.worker
    rules:
      - alert: LazWorkerReadinessFailed
        expr: probe_success{job="laz-worker-readyz"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: LayerZero worker readiness check is failing
          runbook: docs/runbooks/monitoring.md

      - alert: LazChainPaused
        expr: laz_chain_paused == 1
        for: 0m
        labels:
          severity: page
        annotations:
          summary: LayerZero worker chain is paused by safety logic
          runbook: docs/runbooks/monitoring.md

      - alert: LazPathwayPaused
        expr: laz_pathway_paused == 1
        for: 0m
        labels:
          severity: page
        annotations:
          summary: LayerZero worker pathway is paused by safety logic
          runbook: docs/runbooks/monitoring.md

      - alert: LazDVNQuorumConflict
        expr: laz_dvn_jobs_total{status="QUORUM_CONFLICT"} > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: DVN RPC quorum conflict requires operator review
          runbook: docs/runbooks/monitoring.md

      - alert: LazDVNReorgDetected
        expr: laz_dvn_jobs_total{status="REORG_DETECTED"} > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: DVN job remains in reorg-detected state
          runbook: docs/runbooks/monitoring.md

      - alert: LazPacketManualReview
        expr: laz_packets_total{status="MANUAL_REVIEW"} > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: Packet requires manual review before migration approval
          runbook: docs/runbooks/monitoring.md

      - alert: LazExecutorReceiveFailed
        expr: laz_executor_jobs_total{status="LZ_RECEIVE_FAILED"} > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: Executor delivery failed and needs retry review
          runbook: docs/runbooks/monitoring.md

      - alert: LazWorkerManualReview
        expr: laz_executor_jobs_total{status="MANUAL_REVIEW"} > 0 or laz_dvn_jobs_total{status="MANUAL_REVIEW"} > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: Worker job requires manual review before migration approval
          runbook: docs/runbooks/monitoring.md

      - alert: LazTxOutboxFailed
        expr: laz_tx_outbox_total{status="failed",retry_state="exhausted"} > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: Transaction outbox has exhausted failed rows
          runbook: docs/runbooks/monitoring.md

      - alert: LazWorkerFeeNegativeMargin
        expr: laz_worker_fee_negative_margin_jobs > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Worker job actual gas cost exceeds assignment revenue
          runbook: docs/runbooks/monitoring.md

      - alert: LazWorkerFeeReconciliationPending
        expr: laz_worker_fee_unpriced_receipts > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: Worker receipt gas costs are waiting for source-token pricing
          runbook: docs/runbooks/monitoring.md

      - alert: LazSignerLowNativeBalance
        expr: laz_signer_native_balance_wei < laz_signer_min_native_balance_wei
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Worker signer native gas balance is below configured minimum
          runbook: docs/runbooks/monitoring.md

      - alert: LazIndexerPollFailing
        expr: |
          laz_indexer_poll_success == 0
          and laz_indexer_failure_since_timestamp_seconds > 0
          and time() - laz_indexer_failure_since_timestamp_seconds
            > laz_indexer_poll_interval_seconds
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Worker indexer polling is failing
          runbook: docs/runbooks/monitoring.md

      - alert: LazRPCProviderConflict
        expr: laz_rpc_provider_status{status="conflict"} == 1 or laz_rpc_provider_log_conflict == 1 or laz_rpc_provider_state_conflict == 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: RPC provider disagrees with the majority quorum on canonical chain data
          runbook: docs/runbooks/monitoring.md

      # Grouped by scrape identity as well: each worker instance has its own
      # independent provider set, and merging instances would let a healthy
      # instance's providers mask another instance's lost majority.
      - alert: LazRPCQuorumUnavailable
        expr: 2 * count by (chain_eid, job, instance) (laz_rpc_provider_status{status="unavailable"}) >= count by (chain_eid, job, instance) (laz_rpc_provider_status)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Too many RPC providers are unavailable for the fixed majority quorum to form
          runbook: docs/runbooks/monitoring.md

      - alert: LazIndexerPollStalled
        expr: |
          time() - (
            (laz_indexer_last_poll_timestamp_seconds > 0)
            or laz_indexer_start_timestamp_seconds
          ) > 2 * laz_indexer_poll_interval_seconds
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Worker indexer has not completed a poll within twice its configured interval
          runbook: docs/runbooks/monitoring.md

      - alert: LazTxOutboxOrphaned
        # The signing path writes the active attempt and the send status in one
        # statement, so this state is never produced by a healthy code path: a
        # signed row here blocks its nonce lane and a broadcast row is invisible
        # to receipt polling, and neither self-heals. Page on the first sample.
        # The series already excludes disabled (retired) chains, matching the
        # readiness escalation, so a retained row cannot page forever.
        expr: laz_tx_outbox_orphaned_total > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: A send-state tx_outbox row lost its active attempt; the signer lane needs operator recovery
          runbook: docs/runbooks/monitoring.md

      - alert: LazPricingSnapshotNearStale
        expr: laz_pricing_snapshot_time_to_stale_seconds < 300
        # No hold time: time-to-stale decreases monotonically between writes,
        # so any delay here consumes the 300-second warning window and the
        # alert would fire only once quotes are already failing closed.
        for: 0m
        labels:
          severity: page
        annotations:
          summary: On-chain price snapshot is close to its staleAfter cutoff; quotes fail closed once it crosses
          runbook: docs/runbooks/price-bot.md

      - alert: LazPricingPendingStalled
        # Half the validated 600-second freshness margin: escalation must land
        # while the on-chain snapshot still has headroom, even when the pending
        # row was created at the very end of the write schedule.
        expr: laz_pricing_pending_oldest_age_seconds > 300
        for: 0m
        labels:
          severity: page
        annotations:
          summary: A pending pricing transaction is stuck and gating new price writes while the snapshot ages
          runbook: docs/runbooks/price-bot.md
